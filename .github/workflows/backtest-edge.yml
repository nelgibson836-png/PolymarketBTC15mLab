name: Backtest Polymarket Edge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dataset readiness
        id: readiness
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("data/markets_btc15m.json")
          markets = 0
          if p.exists():
              with p.open(encoding="utf-8") as f:
                  data = json.load(f)
              markets = len(data.get("markets", []))

          ready = markets >= 500
          print(f"Dataset markets: {markets}")
          print(f"Dataset ready: {ready}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Run edge backtest
        if: steps.readiness.outputs.ready == 'true'
        run: python polymarket_backtest.py

      - name: Commit report
        if: steps.readiness.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge_backtest.json
          if git diff --cached --quiet; then
            echo "No backtest changes"
          else
            git commit -m "Update Polymarket edge backtest"
            git push
          fi
