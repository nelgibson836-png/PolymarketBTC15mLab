name: Backtest Polymarket Edge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dataset readiness
        id: readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/markets_btc15m.json")
          if not p.exists():
              print("Dataset not found; skipping backtest.")
              raise SystemExit(0)
          with p.open(encoding="utf-8") as f:
              data = json.load(f)
          markets = len(data.get("markets", []))
          print(f"Dataset markets: {markets}")
          if markets < 500:
              print(f"Dataset not ready: {markets}/500 markets. Backtest will be skipped.")
              raise SystemExit(0)
          print("Dataset ready for serious backtest.")
          PY

      - name: Run edge backtest
        run: python polymarket_backtest.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge_backtest.json
          if git diff --cached --quiet; then
            echo "No backtest changes"
          else
            git commit -m "Update Polymarket edge backtest"
            git push
          fi
