name: Backtest Polymarket Edge

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run edge backtest
        run: python polymarket_backtest.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edge_backtest.json
          if git diff --cached --quiet; then
            echo "No backtest changes"
          else
            git commit -m "Update Polymarket edge backtest"
            git push
          fi
