name: Paper Engine Tests

on:
  push:
    paths:
      - "paper_engine.py"
      - "paper_trader.py"
      - "test_paper_engine.py"
      - ".github/workflows/paper-engine-tests.yml"
  pull_request:
    paths:
      - "paper_engine.py"
      - "test_paper_engine.py"
      - ".github/workflows/paper-engine-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: pip install -r requirements.txt
      - name: Compile paper trader
        run: python -m py_compile paper_engine.py paper_trader.py test_paper_engine.py
      - name: Run unit tests
        run: python -m unittest -v test_paper_engine.py
