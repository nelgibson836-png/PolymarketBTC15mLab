name: Collect Polymarket BTC 15m

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect historical BTC 15m markets
        run: python polymarket_collector_fast.py

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets_btc15m.json
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "Update Polymarket BTC 15m dataset"
            git push
          fi
